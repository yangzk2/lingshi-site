name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 失败诊断(输出到 summary, 便于远程排查)
        if: failure()
        run: |
          {
            echo "## 失败诊断"
            echo "- pnpm: $(pnpm --version 2>&1)"
            echo "- node: $(node --version 2>&1)"
            echo "- 锁文件版本: $(head -1 pnpm-lock.yaml 2>&1)"
            echo "- 构建产物 dist: $(ls docs/.vitepress/dist/index.html >/dev/null 2>&1 && echo 存在 || echo 不存在)"
            echo "- Pages 状态: $(curl -s -o /dev/null -w '%{http_code}' https://yangzk2.github.io/lingshi-site/ 2>/dev/null)"
            echo "- 失败发生于上方某个红叉步骤, 请对照"
          } >> "${GITHUB_STEP_SUMMARY}"
