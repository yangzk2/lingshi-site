name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 失败诊断(重放并输出错误注解)
        if: failure()
        run: |
          npm install > /tmp/inst.log 2>&1 || true
          { echo "===== install 重放输出(尾部) ====="; tail -30 /tmp/inst.log; } >> "${GITHUB_STEP_SUMMARY}" || true
          tail -8 /tmp/inst.log | while IFS= read -r line; do
            echo "::error::INST|$line"
          done
